<rect width="100%" height="100%" fill="white"/>
<text x="45" y="35" font-size="24" font-family="Arial" font-weight="bold">Liberty County / Colony Ridge Evidence Flow — Starter Map</text>
<rect x="70" y="70" width="240" height="130" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="86" y="98" font-size="15" font-family="Arial" font-weight="bold">Public Records Inputs</text>
<text x="86" y="128" font-size="12" font-family="Arial" font-weight="normal">Agendas, minutes, MUD</text>
<text x="86" y="145" font-size="12" font-family="Arial" font-weight="normal">audits, deeds, plats, Form</text>
<text x="86" y="162" font-size="12" font-family="Arial" font-weight="normal">1295, TEC, TCEQ, court</text>
<text x="86" y="179" font-size="12" font-family="Arial" font-weight="normal">filings</text>
<rect x="370" y="70" width="240" height="130" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="386" y="98" font-size="15" font-family="Arial" font-weight="bold">Pattern Detection</text>
<text x="386" y="128" font-size="12" font-family="Arial" font-weight="normal">Repeated vendors, shared</text>
<text x="386" y="145" font-size="12" font-family="Arial" font-weight="normal">addresses, campaign timing,</text>
<text x="386" y="162" font-size="12" font-family="Arial" font-weight="normal">board/member overlaps,</text>
<text x="386" y="179" font-size="12" font-family="Arial" font-weight="normal">missing ledgers</text>
