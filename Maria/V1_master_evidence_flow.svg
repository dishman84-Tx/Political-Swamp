<text x="686" y="128" font-size="12" font-family="Arial" font-weight="normal">Procurement, finance/debt,</text>
<text x="686" y="145" font-size="12" font-family="Arial" font-weight="normal">political influence, ISD</text>
<text x="686" y="162" font-size="12" font-family="Arial" font-weight="normal">compliance, enforcement gaps</text>
<rect x="370" y="260" width="240" height="130" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="386" y="288" font-size="15" font-family="Arial" font-weight="bold">Evidence Status</text>
<text x="386" y="318" font-size="12" font-family="Arial" font-weight="normal">Hypothesis → Finding →</text>
<text x="386" y="335" font-size="12" font-family="Arial" font-weight="normal">Confirmed. No person-level</text>
<text x="386" y="352" font-size="12" font-family="Arial" font-weight="normal">claim unless independently</text>
<text x="386" y="369" font-size="12" font-family="Arial" font-weight="normal">supported.</text>
<rect x="670" y="260" width="240" height="130" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="686" y="288" font-size="15" font-family="Arial" font-weight="bold">Visual Outputs</text>
<text x="686" y="318" font-size="12" font-family="Arial" font-weight="normal">Correction map, timeline,</text>
<text x="686" y="335" font-size="12" font-family="Arial" font-weight="normal">graph pack, evidence</text>
<text x="686" y="352" font-size="12" font-family="Arial" font-weight="normal">register, TPIA punch list</text>
<line x1="310" y1="135" x2="370" y2="135" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="135" x2="670" y2="135" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
