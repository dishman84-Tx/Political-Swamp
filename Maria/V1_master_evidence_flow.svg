<text x="70" y="430" font-size="13" font-family="Arial" font-weight="normal">Use this as the master correction map spine. Each box should be linked to one record packet: agenda/minutes,</text>
<text x="70" y="447" font-size="13" font-family="Arial" font-weight="normal">recorded instrument, financial ledger, audit, or enforcement filing.</text>
